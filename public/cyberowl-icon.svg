<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="60%" stop-color="#180e09"/>
      <stop offset="100%" stop-color="#0f0805"/>
    </radialGradient>

    <!-- Golden Crema Gradient -->
    <linearGradient id="cremaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="35%" stop-color="#f5be7e"/>
      <stop offset="75%" stop-color="#d48b46"/>
      <stop offset="100%" stop-color="#8a5332"/>
    </linearGradient>

    <!-- Glowing Eye Gradient -->
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fce7c8"/>
      <stop offset="80%" stop-color="#f5be7e"/>
      <stop offset="100%" stop-color="#d48b46"/>
    </radialGradient>

    <!-- Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle / App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#d48b46" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Subtle Coffee Aura -->
  <circle cx="256" cy="245" r="160" fill="#d48b46" fill-opacity="0.08"/>

  <!-- Cybernetic Owl Head Contour -->
  <path
    d="M100 155 L180 75 L256 135 L332 75 L412 155 L428 305 L350 440 L256 410 L162 440 L84 305 Z"
    fill="#1c110b"
    stroke="url(#cremaGold)"
    stroke-width="16"
    stroke-linejoin="round"
  />

  <!-- V-Plate Forehead Feather Array -->
  <path
    d="M180 75 L256 215 L332 75"
    stroke="url(#cremaGold)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Left Eye Hexagon Socket -->
  <polygon
    points="180,215 228,245 228,305 180,335 132,305 132,245"
    fill="#2d1a11"
    stroke="#d48b46"
    stroke-width="10"
    stroke-linejoin="round"
  />
  <!-- Left Eye Glowing Iris -->
  <circle cx="180" cy="275" r="32" fill="url(#eyeGlow)" filter="url(#glow)"/>
  <circle cx="180" cy="275" r="14" fill="#140c08"/>

  <!-- Right Eye Hexagon Socket -->
  <polygon
    points="332,215 380,245 380,305 332,335 284,305 284,245"
    fill="#2d1a11"
    stroke="#d48b46"
    stroke-width="10"
    stroke-linejoin="round"
  />
  <!-- Right Eye Glowing Iris -->
  <circle cx="332" cy="275" r="32" fill="url(#eyeGlow)" filter="url(#glow)"/>
  <circle cx="332" cy="275" r="14" fill="#140c08"/>

  <!-- Stylized Cyber Beak / Coffee Droplet -->
  <path
    d="M226 295 L256 365 L286 295 Z"
    fill="#f5be7e"
    stroke="url(#cremaGold)"
    stroke-width="8"
    stroke-linejoin="round"
  />

  <!-- Lower Tech Details -->
  <line x1="256" y1="380" x2="256" y2="410" stroke="#f5be7e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="100" cy="155" r="10" fill="#f5be7e"/>
  <circle cx="412" cy="155" r="10" fill="#f5be7e"/>
</svg>
